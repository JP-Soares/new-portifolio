<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- fundo com corte moderno -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"></stop>
      <stop offset="100%" stop-color="#020617"></stop>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"></stop>
      <stop offset="100%" stop-color="#38BDF8"></stop>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect x="10" y="10" width="108" height="108" rx="28" fill="url(#bg)"></rect>

  <!-- cantos “code brackets” -->
  <path d="M30 44 L22 64 L30 84" stroke="url(#accent)" stroke-width="6" fill="none" stroke-linecap="round"></path>
  <path d="M98 44 L106 64 L98 84" stroke="url(#accent)" stroke-width="6" fill="none" stroke-linecap="round"></path>

  <!-- JP estilizado (interligado) -->
  <path d="M52 40 V78 C52 88 44 92 36 92" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"></path>

  <path d="M62 92 V40 H84 C96 40 102 46 102 56 C102 66 96 72 84 72 H62" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"></path>

  <!-- ponto de “cursor” -->
  <circle cx="88" cy="56" r="4" fill="#22D3EE"></circle>
</svg>